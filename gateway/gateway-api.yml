# No GatewayClass authored here — istiod auto-creates one named "istio" the moment it's
# running (controllerName: istio.io/gateway-controller), and istiod also owns/reconciles
# the Deployment+Service that actually implements this Gateway. Unlike the standalone
# Envoy Gateway setup this replaces, there's no separate proxy install step.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: mern-devops
spec:
  gatewayClassName: istio
  # No-op on kind (nothing reads aws-load-balancer-* annotations here) — only takes effect
  # once AWS Load Balancer Controller is running, where it reads these off the Service
  # istiod provisions for this Gateway and provisions a real NLB instead of a generic cloud
  # LB. NLB (not ALB) target-type "ip" since Envoy, not the LB, terminates TLS and does the
  # HTTP routing — AWS LB Controller's Service integration only ever creates NLBs.
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.cndb.atkaridarshan.online'
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.cndb.atkaridarshan.online'
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
            kind: Secret
