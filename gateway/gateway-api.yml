# No GatewayClass authored here — istiod auto-creates one named "istio" the moment it's
# running (controllerName: istio.io/gateway-controller), and istiod also owns/reconciles
# the Deployment+Service that actually implements this Gateway. Unlike the standalone
# Envoy Gateway setup this replaces, there's no separate proxy install step.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: mern-devops
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.cndb.atkaridarshan.online'
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.cndb.atkaridarshan.online'
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
            kind: Secret
