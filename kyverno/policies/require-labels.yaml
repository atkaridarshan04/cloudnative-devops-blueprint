apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Label
    policies.kyverno.io/description: >-
      Define and use labels that identify semantic attributes of your application or Deployment.
      A common set of labels allows tools to work collaboratively, describing objects in a common manner that
      all tools can understand. The recommended labels describe applications in a way that can be
      queried. This policy validates that the label `app.kubernetes.io/name` is specified with some value.
spec:
  # Enforcement mode - blocks resources without required labels
  validationFailureAction: Enforce

  # Background scanning - validates existing resources when policy changes
  background: true

  # admission/emitWarning/skipBackgroundRequests/allowExistingViolations below are
  # Kyverno's own defaults, added by its admission controller regardless — restated here
  # (not omitted) so Argo CD's diff against the live ClusterPolicy actually settles.
  admission: true
  emitWarning: false

  rules:
  - name: check-for-labels
    match:
      any:
      - resources:
          kinds:
          - Pod
    skipBackgroundRequests: true
    validate:
      # anyPattern, not pattern: book-store's own Rollouts only carry the legacy `app`
      # label, while every third-party Helm chart here (external-secrets, kyverno, etc.)
      # only carries `app.kubernetes.io/name` — require whichever one identifies the app.
      message: "A label identifying the app (`app` or `app.kubernetes.io/name`) is required."
      allowExistingViolations: true
      anyPattern:
        - metadata:
            labels:
              app: "?*"
        - metadata:
            labels:
              app.kubernetes.io/name: "?*"
