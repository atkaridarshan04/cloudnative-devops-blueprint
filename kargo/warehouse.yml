# Watches both image repos for new tags and produces Freight when something new shows up.
# `constraint` pins to 1.0.0 on purpose — with no constraint, a Warehouse always picks the
# semantically greatest tag it finds, so if 1.0.0/2.0.0/3.0.0 are all already pushed it jumps
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: book-store
  namespace: book-store
spec:
  subscriptions:
    - image:
        repoURL: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
        constraint: "1.0.0"
    - image:
        repoURL: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
        constraint: "1.0.0"
