apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-overlay
  namespace: book-store
spec:
  vars:
    - name: overlayPath   # e.g. kustomize/overlays/dev
    - name: appName       # e.g. book-store-dev
    - name: branch        # e.g. prod — the branch the ArgoCD Application watches
    - name: repoURL       # same repo for all three Stages — default here so no Stage has to repeat it
      value: https://github.com/atkaridarshan04/CloudNative-DevOps-Blueprint.git

  steps:
    - uses: git-clone
      as: clone
      config:
        repoURL: ${{ vars.repoURL }}
        checkout:
          - branch: ${{ vars.branch }}
            path: ./repo

    - uses: kustomize-set-image
      as: set-image
      config:
        path: ./repo/${{ vars.overlayPath }}
        images:
          - image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
            tag: ${{ imageFrom('ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend').Tag }}
          - image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
            tag: ${{ imageFrom('ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend').Tag }}

    - uses: git-commit
      as: commit
      config:
        path: ./repo
        message: "promote ${{ vars.appName }} to freight ${{ ctx.targetFreight.name }}"

    # Pushes to a fresh kargo/promotion/<promotionName> branch (generateTargetBranch)
    # instead of straight to vars.branch — git-open-pr below turns that branch into a PR.
    - uses: git-push
      as: push
      config:
        path: ./repo
        generateTargetBranch: true

    - uses: git-open-pr
      as: open-pr
      config:
        repoURL: ${{ vars.repoURL }}
        provider: github
        sourceBranch: ${{ task.outputs.push.branch }}
        targetBranch: ${{ vars.branch }}
        title: "chore(${{ ctx.stage }}): bump frontend to ${{ imageFrom('ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend').Tag }}, backend to ${{ imageFrom('ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend').Tag }}"
        description: |
          Automated promotion opened by Kargo — merging this deploys `${{ vars.appName }}`.

          - **Stage:** ${{ ctx.stage }}
          - **Freight:** ${{ ctx.targetFreight.name }}
          - **Frontend tag:** ${{ imageFrom('ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend').Tag }}
          - **Backend tag:** ${{ imageFrom('ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend').Tag }}

    # Blocks here until the PR above is merged (or closed) on GitHub — the manual approval
    # gate. Uses the same git-repo-creds Secret as git-clone/git-push, via the GitHub API.
    # git-open-pr skips (no error) when source/target branches have no diff — happens when
    # this Freight is re-promoted to a Stage that's already at that exact state (nothing for
    # kustomize-set-image/git-commit to change). Without this guard, wait-for-pr would still
    # try to read a PR id that was never created and error with "cannot fetch id from <nil>".
    - uses: git-wait-for-pr
      as: wait-for-pr
      if: ${{ status('open-pr') != 'Skipped' }}
      config:
        repoURL: ${{ vars.repoURL }}
        provider: github
        prNumber: ${{ task.outputs['open-pr'].pr.id }}

    # ArgoCD's own automated sync + selfHeal would eventually pick up this commit on its
    # own — this step also explicitly forces the sync now, and (more importantly) registers
    # the health check this Stage waits on before the Freight is considered verified here.
    - uses: argocd-update
      as: sync
      config:
        apps:
          - name: ${{ vars.appName }}
