# Lives in book-store (the Kargo Project's namespace), not kargo (the operator namespace)
# — Kargo looks for credential Secrets there. The kargo.akuity.io/cred-type: git label is
# how Kargo recognizes this as a repo credential at all; ExternalSecret's target.template
# is what lets an ExternalSecret-managed Secret carry that label, same as any other Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-creds
  namespace: book-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: "{{ .repoURL }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: repoURL
      remoteRef:
        key: kargo/git-creds
        property: repoURL
    - secretKey: username
      remoteRef:
        key: kargo/git-creds
        property: username
    - secretKey: password
      remoteRef:
        key: kargo/git-creds
        property: password

---
# Lives in kargo (the operator namespace, not book-store) — this is what Dex's
# oidc.dex.env secretKeyRef actually reads. Only the OAuth Client Secret is sourced from
# Vault; the Client ID isn't secret and stays a literal in values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-github-oauth
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-github-oauth
    creationPolicy: Owner
    template:
      data:
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: kargo/github-oauth
        property: clientSecret

---
# Pointing the chart at an existing Secret via api.secret.name makes it skip its own
# kargo-api Secret template entirely (confirmed against the chart's own template — that
# field is guarded on `not .Values.api.secret.name`), so passwordHash/tokenSigningKey
# never need to be plain Helm values in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-admin
    creationPolicy: Owner
    template:
      data:
        ADMIN_ACCOUNT_PASSWORD_HASH: "{{ .passwordHash }}"
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ .tokenSigningKey }}"
  data:
    - secretKey: passwordHash
      remoteRef:
        key: kargo/admin
        property: passwordHash
    - secretKey: tokenSigningKey
      remoteRef:
        key: kargo/admin
        property: tokenSigningKey
