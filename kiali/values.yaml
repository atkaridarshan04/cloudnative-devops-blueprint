# Not exposed via the Gateway at all (kubectl port-forward only, same as Prometheus) — no
# login gate needed since it's never reachable outside the cluster.
auth:
  strategy: anonymous

external_services:
  istio:
    root_namespace: istio-system
  prometheus:
    url: http://monitoring-kube-prometheus-prometheus.monitoring:9090
  grafana:
    enabled: true
    internal_url: http://monitoring-grafana.monitoring
    external_url: https://grafana.cndb.atkaridarshan.online
