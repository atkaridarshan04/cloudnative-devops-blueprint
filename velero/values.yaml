serviceAccount:
  server:
    create: true
    name: velero
    # IRSA role ARN annotation is injected via `set` in terraform/modules/velero/main.tf -
    # only known after Terraform creates the role, so it can't be a literal here.

credentials:
  useSecret: false # IRSA replaces the credentials Secret entirely - no static AWS keys.

configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      # bucket + config.region are injected via `set` - bucket name is only known after
      # Terraform creates it.
  volumeSnapshotLocation:
    - name: default
      provider: aws
      # config.region injected via `set`, same reason as above.

snapshotsEnabled: true
deployNodeAgent: false # no non-CSI storage here, so no fs-backup fallback needed.

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.1 # object-store plugin for the S3 BackupStorageLocation above
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
