apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-store-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Required for Kargo's argocd-update promotion step — without this, Kargo refuses to
    # manage this Application at all (security: prevents any Kargo Stage from touching an
    # Application it wasn't explicitly given). Format: <kargo-project>:<stage-name>.
    kargo.akuity.io/authorized-stage: book-store:dev
spec:
  project: book-store

  source:
    repoURL: https://github.com/atkaridarshan04/CloudNative-DevOps-Blueprint.git
    targetRevision: main
    path: kustomize/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
