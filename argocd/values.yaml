# ArgoCD Helm values. The `argocd-secret` keys this Dex config expects
# ($dex.github.clientId/clientSecret) come from Vault via
# external-secrets/sso-secrets.yml's argocd-dex-external-secret (creationPolicy: Merge —
# merges into this Secret without owning it), never committed here.

configs:
  params:
    server.insecure: true   # Gateway terminates TLS, forwards plain HTTP downstream

  cm:
    # Required for Dex to correctly build the redirect_uri it sends to GitHub — without
    # this, Dex falls back to an internal/incorrect base URL, which GitHub then rejects
    # with "Invalid redirect URL: the protocol and host ... must match".
    url: https://argocd.cndb.atkaridarshan.online

    # Disables the built-in local `admin` superuser once GitHub SSO is confirmed working —
    # SSO becomes the only way in. Keep the initial admin secret documented as a
    # break-glass recovery path (re-enable this temporarily + `helm upgrade` to get back in
    # if GitHub OAuth ever breaks) rather than deleting the secret outright.
    admin.enabled: "false"

    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $dex.github.clientId
            clientSecret: $dex.github.clientSecret

  rbac:
    policy.default: role:readonly
    # Defaults to "[groups]" — the g, <email>, role:admin binding below matches by email,
    # which RBAC never examines without this, silently falling back to policy.default
    # (readonly) even though login succeeds. Confirmed live: sync attempts failed with
    # "permission denied" showing only the GitHub numeric sub claim, no email.
    scopes: "[groups, email]"
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, certificates, *, *, allow
      p, role:admin, projects, *, *, allow
      p, role:admin, accounts, *, *, allow
      p, role:admin, gpgkeys, *, *, allow
      g, atkaridarshan04@gmail.com, role:admin

controller:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
repoServer:
  metrics:
    enabled: true
applicationSet:
  metrics:
    enabled: true
