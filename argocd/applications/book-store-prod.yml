apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-store-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    kargo.akuity.io/authorized-stage: book-store:prod
spec:
  project: book-store

  source:
    repoURL: https://github.com/atkaridarshan04/CloudNative-DevOps-Blueprint.git
    targetRevision: prod
    path: kustomize/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      jqPathExpressions:
        - .spec.http[].route[].weight
    - group: networking.istio.io
      kind: DestinationRule
      jqPathExpressions:
        - .spec.subsets[].labels

  revisionHistoryLimit: 10
