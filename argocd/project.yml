apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: book-store
  namespace: argocd
spec:
  description: Book Store Application

# Allowed source repositories for applications in this project
  sourceRepos:
    - 'https://github.com/atkaridarshan04/CloudNative-DevOps-Blueprint.git'

# Allowed destination clusters and namespaces for applications in this project.
# Both deployment paths below share this one AppProject.
  destinations:
    # --- Path A: Helm chart (argocd/application.yml) ---
    - namespace: mern-devops
      server: https://kubernetes.default.svc

    # --- Path B: Kustomize overlays (argocd/application-{dev,staging,prod}.yml) ---
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
    - namespace: prod
      server: https://kubernetes.default.svc

# Included resource kinds that can be created cluster-wide.
# Shared by both paths below — not split per-path, since several of these (PersistentVolume,
# RBAC, cert-manager, Gateway API) are used by other guides in this repo too, not cleanly
# owned by just one of the two ArgoCD paths.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'cert-manager.io'
      kind: ClusterIssuer
    - group: 'gateway.networking.k8s.io'
      kind: GatewayClass

# Included resource kinds that can be deployed within the target namespace.
# Shared by both paths below. Note: 'networking.k8s.io/Ingress' is used only by Path B
# (Kustomize's nginx Ingress) — Path A (Helm chart) uses Gateway API (GatewayClass/Gateway/
# HTTPRoute, in the cluster-scoped list above and HTTPRoute here) instead of Ingress.
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ServiceAccount
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: 'networking.k8s.io'
      kind: Ingress
    - group: 'autoscaling'
      kind: HorizontalPodAutoscaler
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'gateway.networking.k8s.io'
      kind: GatewayClass
    - group: 'gateway.networking.k8s.io'
      kind: Gateway
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
