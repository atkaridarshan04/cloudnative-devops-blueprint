apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-destinationrule
spec:
  host: frontend-service
  subsets:
    - name: stable
      labels:
        app: frontend
    - name: canary
      labels:
        app: frontend

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-virtualservice
spec:
  hosts:
    - frontend-service
  http:
    - name: primary
      route:
        - destination:
            host: frontend-service
            subset: stable
          weight: 100
        - destination:
            host: frontend-service
            subset: canary
          weight: 0

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-rollout
  labels:
    app: frontend
spec:
  replicas: 1
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: frontend-virtualservice
            routes:
              - primary
          destinationRule:
            name: frontend-destinationrule
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: { duration: 10s }
        - setWeight: 100
        - pause: { duration: 10s }
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # nginx needs root to bind/serve — hostUsers: false maps that container root to an
      # unprivileged host UID (K8s 1.36+) instead of running non-root, unlike backend/mongodb.
      hostUsers: false
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
