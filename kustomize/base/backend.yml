apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend

---
# Single Service — Rollouts shifts traffic via the DestinationRule's subset labels below,
# not by moving pods between separate stable/canary Services.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

---
# Rollouts patches subsets[].labels to add rollouts-pod-template-hash as it progresses —
# the `app: backend` seeded here is just a valid starting point, not what actually
# distinguishes stable from canary at runtime.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-destinationrule
spec:
  host: backend-service
  subsets:
    - name: stable
      labels:
        app: backend
    - name: canary
      labels:
        app: backend

---
# Mesh-internal only (gateways omitted -> defaults to ["mesh"]) — external/gateway-attached
# routing stays on Gateway API HTTPRoute, per Istio's own recommendation against attaching
# VirtualService directly to a Gateway API Gateway.
# Rollouts mutates the two weight fields below as the canary progresses.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend-virtualservice
spec:
  hosts:
    - backend-service
  http:
    - name: primary
      route:
        - destination:
            host: backend-service
            subset: stable
          weight: 100
        - destination:
            host: backend-service
            subset: canary
          weight: 0

---
# virtualService.name/destinationRule.name are literal string refs Kustomize's namePrefix
# won't rewrite (same class of issue as the old gatewayAPI plugin's httpRoute field) — each
# overlay's kustomization.yml JSON6902-patches the prefixed names in explicitly.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-rollout
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: backend-virtualservice
            routes:
              - primary
          destinationRule:
            name: backend-destinationrule
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: { duration: 10s }
        - setWeight: 100
        - pause: { duration: 10s }
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      # Pod-level: enforces non-root execution for the whole pod (satisfies Kyverno's
      # require-userns-or-nonroot and PSA's restricted level).
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            - name: mongoDBURL
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials-external
                  key: MONGODB_URL
          livenessProbe:
            httpGet:
              path: /books
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /books
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
