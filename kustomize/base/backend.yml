apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service-stable
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service-canary
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

---
# canaryService/stableService and trafficRouting.plugins.*.httpRoute are literal string
# refs Kustomize's namePrefix won't rewrite (unlike Service/Deployment refs it recognizes
# natively) — each overlay's app-patches.yml sets the prefixed names explicitly.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-rollout
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    canary:
      canaryService: backend-service-canary
      stableService: backend-service-stable
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: mern-route
            # namespace omitted — defaults to the Rollout's own namespace, which Kustomize's
            # namespace transformer already sets correctly per overlay.
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: { duration: 10s }
        - setWeight: 100
        - pause: { duration: 10s }
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      # Pod-level: enforces non-root execution for the whole pod (satisfies Kyverno's
      # require-userns-or-nonroot and PSA's restricted level).
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            - name: mongoDBURL
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials-external
                  key: MONGODB_URL
          livenessProbe:
            httpGet:
              path: /books
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /books
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
