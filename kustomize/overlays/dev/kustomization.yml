apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
namePrefix: dev-
resources:
- ../../base
- namespace.yml
patches:
- path: app-patches.yml
- path: httproute-patch.yml
images:
- name: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
  newTag: 3.0.0
- name: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
  newTag: 3.0.0
configMapGenerator:
- name: backend-config
  literals:
  - PORT=8000
  - mongoDBURL=mongodb://admin:password123@dev-mongodb-deployment-0.dev-mongodb-service-headless.dev.svc.cluster.local:27017/db?authSource=admin
