apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mern-route
spec:
  hostnames:
    - dev.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dev-frontend-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /books
      backendRefs:
        - name: dev-backend-service
          port: 8000
