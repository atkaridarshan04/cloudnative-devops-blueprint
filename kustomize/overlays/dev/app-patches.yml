apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-rollout
spec:
  replicas: 1
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: dev-backend-virtualservice
          destinationRule:
            name: dev-backend-destinationrule
  template:
    spec:
      # Not auto-rewritten by Kustomize's namePrefix either (only object names/labels/
      # selectors it recognizes get rewritten) — same reason as the istio names above.
      serviceAccountName: dev-backend
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # containers[] is a list — same Kustomize CRD-merge caveat as subsets[]/http[] below,
      # restated in full (env/ports/probes/resources/securityContext), not just name+image.
      containers:
        - name: backend
          image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend # Tag managed by Kustomize images
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            - name: mongoDBURL
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials-external
                  key: MONGODB_URL
          livenessProbe:
            httpGet:
              path: /books
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /books
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-rollout
spec:
  replicas: 1
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: dev-frontend-virtualservice
          destinationRule:
            name: dev-frontend-destinationrule
  template:
    spec:
      hostUsers: false
      serviceAccountName: dev-frontend
      containers:
        - name: frontend
          image: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend # Tag managed by Kustomize images
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

---
# host/hosts/destination.host are literal string refs to the Service, same reason they
# need explicit prefixed names as everything else Kustomize's namePrefix won't rewrite for
# custom CRDs. http[]/subsets[] are lists — Kustomize's generic CRD patch merge replaces
# lists wholesale rather than merging by key, so these are restated in full, not partial.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-destinationrule
spec:
  host: dev-backend-service
  subsets:
    - name: stable
      labels:
        app: backend
    - name: canary
      labels:
        app: backend

---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-destinationrule
spec:
  host: dev-frontend-service
  subsets:
    - name: stable
      labels:
        app: frontend
    - name: canary
      labels:
        app: frontend

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend-virtualservice
spec:
  hosts:
    - dev-backend-service
  http:
    - name: primary
      route:
        - destination:
            host: dev-backend-service
            subset: stable
          weight: 100
        - destination:
            host: dev-backend-service
            subset: canary
          weight: 0

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-virtualservice
spec:
  hosts:
    - dev-frontend-service
  http:
    - name: primary
      route:
        - destination:
            host: dev-frontend-service
            subset: stable
          weight: 100
        - destination:
            host: dev-frontend-service
            subset: canary
          weight: 0
