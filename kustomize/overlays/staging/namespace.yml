apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    environment: staging
    app: mern-stack
    istio-injection: enabled
    # Disabled for now: baseline blocks istio-init's required NET_ADMIN/NET_RAW capabilities
    # since istio-cni isn't installed. Re-enable once istio-cni is added (or PSA moves to
    # only warn/audit) so sidecar-injected pods can actually start.
    # pod-security.kubernetes.io/enforce: baseline
    # pod-security.kubernetes.io/enforce-version: latest
    # pod-security.kubernetes.io/audit: restricted
    # pod-security.kubernetes.io/audit-version: latest
    # pod-security.kubernetes.io/warn: restricted
    # pod-security.kubernetes.io/warn-version: latest
