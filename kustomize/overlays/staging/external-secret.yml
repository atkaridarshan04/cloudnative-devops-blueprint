apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mongodb-credentials-external # unprefixed — namespace isolation (dev/staging/prod) already prevents collision
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MONGODB_URL: "mongodb://{{ .username }}:{{ .password }}@staging-mongodb-deployment-0.staging-mongodb-service-headless.staging.svc.cluster.local:27017/db?authSource=admin"
        MONGODB_USER: "{{ .username }}"
        MONGODB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: staging/mern-backend/mongodb
        property: username
    - secretKey: password
      remoteRef:
        key: staging/mern-backend/mongodb
        property: password
