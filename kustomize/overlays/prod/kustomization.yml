apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
namePrefix: prod-
resources:
- ../../base
- namespace.yml
- external-secret.yml
patches:
- path: app-patches.yml
- path: httproute-patch.yml
images:
- name: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
  newTag: 3.0.0
- name: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
  newTag: 3.0.0
configMapGenerator:
- name: backend-config
  literals:
  - PORT=8000
  options:
    disableNameSuffixHash: true
