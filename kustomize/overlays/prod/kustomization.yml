apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
namePrefix: prod-
resources:
- ../../base
- namespace.yml
- external-secret.yml
patches:
- path: app-patches.yml
- path: httproute-patch.yml
images:
- name: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
  newTag: 3.0.0
- name: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
  newTag: 3.0.0
configMapGenerator:
- name: backend-config
  literals:
  - PORT=8000
  options:
    # Kustomize doesn't know the Rollout CRD's env[].valueFrom.configMapKeyRef.name path,
    # so it can't auto-rewrite references to this generator's hashed output name — same
    # blind spot as containers[] above. Disabling the hash keeps the name deterministic
    # (prod-backend-config) so app-patches.yml can reference it by its literal prefixed name.
    disableNameSuffixHash: true
