apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mern-route
spec:
  hostnames:
    - app.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prod-frontend-service-stable
          port: 80
          weight: 100
        - name: prod-frontend-service-canary
          port: 80
          weight: 0
    - matches:
        - path:
            type: PathPrefix
            value: /books
      backendRefs:
        - name: prod-backend-service-stable
          port: 8000
          weight: 100
        - name: prod-backend-service-canary
          port: 8000
          weight: 0
