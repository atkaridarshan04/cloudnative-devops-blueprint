apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argorollouts-route
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: mern-devops
  hostnames:
    - argorollouts.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        # Routes through oauth2-proxy (see oauth2-proxy-values.yaml, sso-deploy.md) since
        # argo-rollouts-dashboard has no built-in auth — verify the actual Service name
        # with `kubectl get svc -n argo-rollouts` after installing (Helm fullname
        # templating; release name "argorollouts-oauth2-proxy" should produce this name).
        - name: argorollouts-oauth2-proxy
          port: 4180
