# Argo Rollouts doesn't bundle the Gateway API traffic-routing plugin by default — this
# tells the controller where to fetch it. Pinned to a specific release rather than `latest`
# so upgrades don't happen silently underneath a running rollout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-config
  namespace: argo-rollouts
data:
  trafficRouterPlugins: |-
    - name: "argoproj-labs/gatewayAPI"
      location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.16.0/gatewayapi-plugin-linux-amd64"
