# Committed in cleartext deliberately — this is the same dev-mode root token already
# hardcoded in vault-deployment.yml's VAULT_DEV_ROOT_TOKEN_ID, so there's nothing here
# that keeping out of git would actually protect. Avoids a manual `kubectl create secret`
# bootstrap step for a value that isn't a secret to begin with.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: vault
type: Opaque
data:
  token: cm9vdA== # root
