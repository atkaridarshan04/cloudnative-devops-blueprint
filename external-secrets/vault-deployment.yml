# Dev-mode Vault — root token hardcoded below, not a real secret (dev mode always seeds
# the same root token; that's the point, this is a demo backend, not production Vault).
# Applied manually alongside the rest of the platform bootstrap (gateway/, monitoring/) —
# not part of any ArgoCD Application, so (unlike mern-devops/dev/staging/prod) nothing
# else creates this namespace for us.
apiVersion: v1
kind: Namespace
metadata:
  name: vault

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          args: ["server", "-dev"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: root
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
          ports:
            - containerPort: 8200

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
