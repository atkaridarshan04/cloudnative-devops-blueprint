# SSO credentials for the three GitHub-OAuth-gated UIs, sourced from Vault like every other
# secret here. Lives here rather than alongside each tool (unlike kargo/external-secret.yml)
# since ArgoCD's own lifecycle isn't an ArgoCD Application (see argocd/platform-project.yml)
# — this Application (external-secrets) is what actually applies these.

# Merge, not Owner — argocd-secret already exists (created by the argo-cd chart itself,
# holding its own server signing key etc.); this only adds the two Dex keys without
# taking ownership of the whole Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-external-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      data:
        dex.github.clientId: "{{ .clientId }}"
        dex.github.clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: argocd/dex
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: argocd/dex
        property: clientSecret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-oauth-external-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-github-oauth
    creationPolicy: Owner
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: monitoring/grafana-oauth
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: monitoring/grafana-oauth
        property: clientSecret

---
# Key names (client-id/client-secret/cookie-secret) confirmed against the oauth2-proxy
# chart's own rendered output (config.existingSecret consumers), not assumed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argorollouts-oauth2-proxy-external-secret
  namespace: argo-rollouts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argorollouts-oauth2-proxy
    creationPolicy: Owner
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
        cookie-secret: "{{ .cookieSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: argo-rollouts/oauth2-proxy
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: argo-rollouts/oauth2-proxy
        property: clientSecret
    - secretKey: cookieSecret
      remoteRef:
        key: argo-rollouts/oauth2-proxy
        property: cookieSecret
