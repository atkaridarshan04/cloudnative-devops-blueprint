# Production-mode Vault — Integrated Storage (Raft), backed by a PVC instead of the earlier
# `-dev` in-memory mode. Comes up sealed and uninitialized on first deploy; a one-time
# `vault operator init` + `vault operator unseal` + kv-v2 mount is required before any
# ExternalSecret can resolve (see docs/ExternalSecrets.md). No auto-unseal configured —
# every pod restart needs a manual unseal with the same key generated at init time.
apiVersion: v1
kind: Namespace
metadata:
  name: vault

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = "true"
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }

    cluster_addr  = "http://vault-0.vault-internal:8201"
    api_addr      = "http://vault-0.vault-internal:8200"
    disable_mlock = true

---
# Headless — gives the single raft pod the stable "vault-0.vault-internal" DNS name its own
# config (cluster_addr/api_addr above) points at.
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault
spec:
  clusterIP: None
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
    - name: cluster
      port: 8201
      targetPort: 8201

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault-internal
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          args: ["server"]
          ports:
            - name: http
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
              readOnly: true
            - name: vault-data
              mountPath: /vault/data
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
