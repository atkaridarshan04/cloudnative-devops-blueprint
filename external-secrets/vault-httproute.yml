apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: vault
  annotations:
    # external-secrets' other resources (ClusterSecretStore/SecretStore CRDs) need
    # Application-wide ServerSideApply=true, but SSA's dry-run diff against this resource
    # never quite settles even when live matches git exactly — opt this one back out to
    # client-side apply, same as monitoring's Grafana/Prometheus HTTPRoutes.
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  parentRefs:
    - name: istio-gateway
      namespace: mern-devops
  hostnames:
    - vault.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: vault
          port: 8200
