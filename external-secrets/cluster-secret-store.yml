# Cluster-scoped (vs. a namespaced SecretStore) so all three envs — dev/staging/prod — can
# reference the same one, instead of duplicating a SecretStore per namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: vault
          key: token
