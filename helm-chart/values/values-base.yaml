serviceAccount:
  create: true
  name: ""

services:
  frontend:
    replicas: 1
    imageRepo: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
    tag: 3.0.0
    containerPort: 80
    service:
      type: ClusterIP
      port: 80
    route:
      path: /
    env: {}

    # Unmeasured first-guess sizing.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 15

    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 15

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0

  backend:
    replicas: 1
    imageRepo: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
    tag: 3.0.0
    containerPort: 8000
    service:
      type: ClusterIP
      port: 8000
    route:
      path: /books

    # name is a suffix - prefixed with the release name.
    env:
      PORT:
        valueFrom:
          configMapKeyRef:
            name: backend-config
            key: PORT
      mongoDBURL:
        valueFrom:
          configMapKeyRef:
            name: backend-config
            key: mongoDBURL
      LOG_LEVEL:
        value: info

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    livenessProbe:
      httpGet:
        path: /books
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 15

    readinessProbe:
      httpGet:
        path: /books
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 15

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0

  mongodb:
    statefulset: true
    replicas: 1
    image: mongo:4.4
    containerPort: 27017
    volumeMountPath: /data/db
    service:
      port: 27017

    # name is a suffix - prefixed with the release name.
    env:
      MONGO_INITDB_ROOT_USERNAME:
        valueFrom:
          secretKeyRef:
            name: mongodb-secret
            key: username
      MONGO_INITDB_ROOT_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: mongodb-secret
            key: password
      MONGO_INITDB_DATABASE:
        value: db

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    livenessProbe:
      tcpSocket:
        port: 27017
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3

    readinessProbe:
      exec:
        command: ["mongo", "--eval", "db.adminCommand('ping')"]
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3


# Domain config, distinct from services.mongodb's workload-shape fields.
mongodb:
  username: admin
  password: password123
  dbName: db
  authSource: admin

persistentVolumeClaim:
  accessMode: ReadWriteOnce
  storage: 1Gi
  storageClassName: standard
