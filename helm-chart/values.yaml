namespace: mern-devops

frontend:
  replicas: 1
  imageRepo: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-frontend
  tag: 2.0.0
  containerPort: 80

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80

backend: 
  replicas: 1
  imageRepo: ghcr.io/atkaridarshan04/cloudnative-devops-blueprint/bookstore-backend
  tag: 2.0.0 
  containerPort: 8000

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  service:
    type: ClusterIP
    port: 8000


persistentVolume:
  capacity: 1Gi
  accessMode: ReadWriteOnce
  reclaimPolicy: Retain
  storageClassName: manual
  hostPath: "/mnt/data"

persistentVolumeClaim:
  accessMode: ReadWriteOnce
  storage: 1Gi
  storageClassName: manual


# Gateway reference — points to the Gateway this HTTPRoute attaches to.
# Defaults match the Gateway created by Terraform (modules/addons) on EKS.
# LOCAL (kind): override with --set gateway.name=mern-devops-envoy-gateway,gateway.namespace=mern-devops
gateway:
  name: bookstore-gateway
  namespace: default

mongodb:
  replicas: 1
  image: mongo:4.4
  serviceName: mongodb-service

  username: admin
  password: password123
  dbName: db

  authSource: admin

  # EKS only: storage size for the EBS volumeClaimTemplate.
  # Uncomment volumeClaimTemplates in mongodb.yaml and StorageClass in volume.yaml to use.
  storage: 5Gi