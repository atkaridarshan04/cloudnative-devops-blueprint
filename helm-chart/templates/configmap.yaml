---
# Backend-specific, not part of the services: map - frontend has no config to
# inject, and this is the only ConfigMap in the chart today. A generic
# configMaps: {} map isn't worth building for a single instance - and
# mongoDBURL has to be computed in a template regardless, since values.yaml
# is never template-processed by Helm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend-config
  namespace: {{ .Values.namespace }}
data:
  PORT: "{{ .Values.services.backend.containerPort }}"
  mongoDBURL: {{ include "mern-chart.mongoURL" . | quote }}
