apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.namespace }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /books
      backendRefs:
        - name: {{ .Release.Name }}-backend-service-stable
          port: {{ .Values.backend.service.port }}
          weight: 100
        - name: {{ .Release.Name }}-backend-service-canary
          port: {{ .Values.backend.service.port }}
          weight: 0
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-frontend-service-stable
          port: {{ .Values.frontend.service.port }}
          weight: 100
        - name: {{ .Release.Name }}-frontend-service-canary
          port: {{ .Values.frontend.service.port }}
          weight: 0
