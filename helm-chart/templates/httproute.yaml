---
# Attaches to the one shared cluster Gateway (applied once, standalone, via
# kustomize/gateway.yml) - this chart does not create a GatewayClass/Gateway
# of its own. `hostnames` disambiguates this release's traffic from any other
# release (dev/staging/prod) sharing the same Gateway. Each rule below comes
# from whichever services.<name> entries declare their own `route` - adding
# a new web-facing service never requires editing this file; a service with
# no `route` (mongodb) is simply skipped.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-mern-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    {{- range $name, $svc := .Values.services }}
    {{- with $svc.route }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ $.Release.Name }}-{{ $name }}-service
          port: {{ $svc.service.port }}
    {{- end }}
    {{- end }}
