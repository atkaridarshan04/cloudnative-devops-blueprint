---
# Attaches to the shared Gateway (apply once, see docs/Helm.md).
# Rules come from each service's own `route`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-mern-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    {{- range $name, $svc := .Values.services }}
    {{- with $svc.route }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ $.Release.Name }}-{{ $name }}-service
          port: {{ $svc.service.port }}
    {{- end }}
    {{- end }}
