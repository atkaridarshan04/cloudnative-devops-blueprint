# =============================================================================
# GATEWAY API — HTTPRoute
# =============================================================================
#
# LOCAL (kind):
#   GatewayClass and Gateway are NOT created by Terraform here.
#   You must create them manually before installing this chart:
#
#     kubectl apply -f kubernetes/gateway-api.yml
#
#   That file creates the GatewayClass + Gateway for local kind use.
#   Then patch the envoy service to NodePort for local access (see Helm.md).
#
# EKS (AWS):
#   GatewayClass, EnvoyProxy config, and Gateway are provisioned by Terraform
#   (terraform/modules/addons). The HTTPRoute below references that Gateway.
#   No manual steps needed.
#
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-mern-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /books
      backendRefs:
        - name: {{ .Release.Name }}-backend-service
          port: {{ .Values.backend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-frontend-service
          port: {{ .Values.frontend.service.port }}

