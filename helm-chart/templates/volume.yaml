# -------------------------------------------------------------------
# LOCAL (kind) — hostPath PV + PVC
# Used when running locally with kind cluster.
# Uncomment this block and comment out the EBS StorageClass below.
# -------------------------------------------------------------------
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-mongo-pv
spec:
  capacity:
    storage: {{ .Values.persistentVolume.capacity }}
  accessModes:
    - {{ .Values.persistentVolume.accessMode }}
  persistentVolumeReclaimPolicy: {{ .Values.persistentVolume.reclaimPolicy }}
  storageClassName: {{ .Values.persistentVolume.storageClassName }}
  hostPath:
    path: {{ .Values.persistentVolume.hostPath }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mongo-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - {{ .Values.persistentVolumeClaim.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistentVolumeClaim.storage }}
  storageClassName: {{ .Values.persistentVolumeClaim.storageClassName }}

# -------------------------------------------------------------------
# EKS (AWS) — EBS gp3 StorageClass
# Used when deploying on AWS EKS. The EBS CSI driver is pre-installed
# on EKS Auto Mode clusters. Uses WaitForFirstConsumer so the volume
# is provisioned in the same AZ as the pod.
# Uncomment this block when deploying on EKS.
# -------------------------------------------------------------------
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Release.Name }}-ebs-sc
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
