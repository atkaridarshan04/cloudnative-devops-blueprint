---
# Backend-specific, not part of the services: map - mongodb is the only
# service with a credentials secret right now. Plaintext in values.yaml is
# a known gap, fixed in a later step (replaced with an ExternalSecret).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongodb-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  username: {{ .Values.mongodb.username | b64enc }}
  password: {{ .Values.mongodb.password | b64enc }}
