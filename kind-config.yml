kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # for gateway api
        hostPort: 80
        protocol: TCP
      - containerPort: 30443   # for gateway api HTTPS (TLS)
        hostPort: 443
        protocol: TCP
