# kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80 # for nginx ingress (retired — see docs/Kustomize.md)
        hostPort: 81
        protocol: TCP
      - containerPort: 30080 # for gateway api
        hostPort: 30080
        protocol: TCP
      - containerPort: 30001 # for ArgoCD UI
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002 # for Kargo UI
        hostPort: 30002
        protocol: TCP
