kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # istiod provisions the Gateway's backing Service as type: LoadBalancer — kind has no
      # LB controller, so it sits <pending> forever. Patch that Service to NodePort with
      # these exact ports (README's "DNS + verify" step) to reach it locally.
      - containerPort: 30080   # Istio Gateway HTTP :80
        hostPort: 80
        protocol: TCP
      - containerPort: 30443   # Istio Gateway HTTPS :443 (TLS)
        hostPort: 443
        protocol: TCP
      # No separate NodePort for Kargo (or anything else) — it routes through this same
      # Gateway via hostname (kargo.cndb.atkaridarshan.online, kargo/httproute.yml), same as
      # ArgoCD/Grafana/Prometheus/Rollouts. Kargo's own TLS is disabled (kargo/values.yaml)
      # so the Gateway can terminate it, same pattern as ArgoCD's server.insecure: true.
