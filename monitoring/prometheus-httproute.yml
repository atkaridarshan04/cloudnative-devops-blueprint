# `prometheus-operated` is the Service prometheus-operator creates automatically for the
# Prometheus StatefulSet — stable regardless of the Helm release name (unlike Grafana's
# Service, which is release-name-prefixed).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
  annotations:
    # monitoring's other resources (Prometheus/Alertmanager CRDs) need Application-wide
    # ServerSideApply=true, but SSA's dry-run diff against this resource never quite
    # settles even when live matches git exactly — opt this one back out to client-side
    # apply, same as book-store's HTTPRoutes (which don't use SSA and don't drift).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  parentRefs:
    - name: istio-gateway
      namespace: mern-devops
  hostnames:
    - prometheus.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: prometheus-operated
          port: 9090
