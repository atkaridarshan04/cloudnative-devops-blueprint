# `prometheus-operated` is the Service prometheus-operator creates automatically for the
# Prometheus StatefulSet — stable regardless of the Helm release name (unlike Grafana's
# Service, which is release-name-prefixed).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
spec:
  parentRefs:
    - name: istio-gateway
      namespace: mern-devops
  hostnames:
    - prometheus.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: prometheus-operated
          port: 9090
