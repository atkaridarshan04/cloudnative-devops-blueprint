# Kube-Prometheus-Stack Configuration
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
          storageClassName: standard
    # Allow Prometheus to pick up PrometheusRules from all namespaces
    ruleNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: monitoring
  service:
    type: ClusterIP   # Reached via Gateway API HTTPRoute, not exposed directly

alertmanager:
  enabled: true
  service:
    type: ClusterIP

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# kube-prometheus-stack auto-discovers node-exporter and kube-state-metrics
# via ServiceMonitors - no need for manual static scrape configs

prometheusOperator:
  enabled: true

# ---------------------------------------------------------------------------------
grafana:
  enabled: true
  # break-glass admin login, only needed if GitHub OAuth below ever breaks — from Vault,
  # never committed here.
  admin:
    existingSecret: grafana-admin
  service:
    type: ClusterIP   # Reached via Gateway API HTTPRoute, not exposed directly

  # client-id/client-secret keys come from Vault, never committed here. envValueFrom injects
  # them as env vars, and grafana.ini references them via $__env{} so the plaintext secret
  # never touches values.yaml/git.
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_ID:
      secretKeyRef:
        name: grafana-github-oauth
        key: client-id
    GF_AUTH_GITHUB_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-github-oauth
        key: client-secret

  grafana.ini:
    server:
      root_url: https://grafana.cndb.atkaridarshan.online
    # Hides the local admin/password login form once GitHub SSO is confirmed working —
    # SSO becomes the only way in. The admin/password credentials above still work if you
    # ever need break-glass access — just flip this back to false temporarily.
    auth:
      disable_login_form: true
    auth.github:
      enabled: true
      allow_sign_up: true
      client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      # Without this, every GitHub login (including yours) gets the default
      # auto_assign_org_role (Viewer) — only the local admin/password account would have
      # real admin rights. Maps this specific GitHub username to Admin, everyone else Viewer.
      role_attribute_path: login=='atkaridarshan04' && 'Admin' || 'Viewer'

  persistence:
    enabled: true
    type: pvc
    size: 5Gi
    storageClassName: standard

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: 'argocd'
        orgId: 1
        folder: 'ArgoCD Monitoring'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/argocd
      - name: 'tls'
        orgId: 1
        folder: 'TLS & Certificates'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/tls
      - name: 'istio'
        orgId: 1
        folder: 'Istio'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/istio

  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

    argocd:
      argocd:
        gnetId: 14584
        revision: 1
      argocd-application-overview:
        gnetId: 19974
        revision: 1

    tls:
      blackbox-exporter:
        gnetId: 7587
        revision: 1
        datasource: Prometheus

    istio:
      istio-mesh:
        gnetId: 7639
        revision: 1
        datasource: Prometheus
      istio-control-plane:
        gnetId: 7645
        revision: 1
        datasource: Prometheus
      istio-service:
        gnetId: 7636
        revision: 1
        datasource: Prometheus
