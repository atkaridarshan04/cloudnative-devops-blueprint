---
# Envoy Gateway control plane (the operator itself — reconciliation/xDS metrics).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway-controller-metrics
  namespace: envoy-gateway-system
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics

---
# The Envoy proxy data plane (actual app traffic — request rate/latency/error rate per
# route). Its metrics port (19001) isn't exposed on the proxy's Service, only on the Pod,
# so this needs a PodMonitor rather than a ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy-metrics
  namespace: envoy-gateway-system
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
      gateway.envoyproxy.io/owning-gateway-namespace: mern-devops
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
