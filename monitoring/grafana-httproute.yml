# Assumes the kube-prometheus-stack Helm release is named "monitoring" (Grafana subchart
# Service naming convention: <release-name>-grafana). Grafana serves plain HTTP internally
# by default, so no --insecure-equivalent flag needed (unlike ArgoCD).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
  annotations:
    # monitoring's other resources (Prometheus/Alertmanager CRDs) need Application-wide
    # ServerSideApply=true, but SSA's dry-run diff against this resource never quite
    # settles even when live matches git exactly — opt this one back out to client-side
    # apply, same as book-store's HTTPRoutes (which don't use SSA and don't drift).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  parentRefs:
    - name: istio-gateway
      namespace: mern-devops
  hostnames:
    - grafana.cndb.atkaridarshan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: monitoring-grafana
          port: 80
