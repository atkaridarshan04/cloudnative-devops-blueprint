# Referenced by monitoring/values.yaml's grafana.admin.existingSecret — keys match the
# chart's own admin.userKey/passwordKey defaults (admin-user/admin-password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: "{{ .username }}"
        admin-password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: monitoring/grafana-admin
        property: username
    - secretKey: password
      remoteRef:
        key: monitoring/grafana-admin
        property: password
